services:
  embedding-api:
    build:
      context: .
      dockerfile: embedding_app/Dockerfile
      args:
        - EMBEDDING_PORT=${EMBEDDING_PORT}
    container_name: embedding-api-prod
    ports:
      - "${EMBEDDING_PORT}:${EMBEDDING_PORT}"
    environment:
      - API_SECRET_KEY=${API_SECRET_KEY}
      - MODEL_NAME=${MODEL_NAME}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES}
      - LOG_LEVEL=${LOG_LEVEL}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - EMBEDDING_PORT=${EMBEDDING_PORT}
      - HF_HOME=/app/models
    volumes:
      # Mount the local models directory into container
      - ./models:/app/models:ro
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${EMBEDDING_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-prod
    ports:
      - "${QDRANT_REST_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_READ_ONLY_API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:latest
    container_name: nginx-proxy-prod
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ai-network
    depends_on:
      embedding-api:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok-tunnel-prod
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    networks:
      - ai-network
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  qdrant-storage:

networks:
  ai-network:
    driver: bridge