user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Upstream definitions
    upstream embedding_api {
        server embedding-api:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream qdrant_api {
        server qdrant-db:6333 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=embedding_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=qdrant_limit:10m rate=50r/s;

    server {
        listen 80 default_server;
        server_name _;

        client_body_timeout 300s;
        client_header_timeout 300s;
        send_timeout 300s;
        keepalive_timeout 65s;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ==================== ROOT ====================
        location = / {
            access_log off;
            return 200 '{"status":"ok","service":"AI Stack"}';
            add_header Content-Type application/json;
        }

        # ==================== HEALTH CHECK ====================
        location = /health {
            access_log off;
            proxy_pass http://embedding_api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ==================== EMBEDDING API ====================
        location ~ ^/v1/ {
            limit_req zone=embedding_limit burst=20 nodelay;

            proxy_pass http://embedding_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }

        # ==================== QDRANT API ====================
        location /api/ {
            limit_req zone=qdrant_limit burst=10 nodelay;

            proxy_pass http://qdrant_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header api-key $http_api_key;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /collections {
            limit_req zone=qdrant_limit burst=10 nodelay;

            proxy_pass http://qdrant_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header api-key $http_api_key;
            proxy_set_header Connection "";
        }

        location /dashboard/ {
            proxy_pass http://qdrant_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header api-key $http_api_key;
        }

        location /cluster {
            limit_req zone=qdrant_limit burst=10 nodelay;

            proxy_pass http://qdrant_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header api-key $http_api_key;
            proxy_set_header Connection "";
        }

        # ==================== REDIRECTS ====================
        location ~ ^/qdrant/?$ {
            return 301 /dashboard/;
        }
    }
}